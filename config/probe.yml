# Search indices, one per searchable model, named <index>_<environment>. Each name is an alias of the concrete index
# Probe last built, so a model can be reindexed into a new index and switched over at once.
shared:
  indices: [courts, judges, hearings, decrees, decree_pages, proceedings, selection_procedures]
  per_page: 20
  settings:
    number_of_shards: 1
    number_of_replicas: 0
    analysis:
      analyzer:
        # Full text: Slovak words match with or without diacritics, in any case.
        text_analyzer:
          type: custom
          tokenizer: standard
          filter: [asciifolding, lowercase, trim]
      normalizer:
        # Keyword values compared the same way, for suggestions.
        folding:
          type: custom
          filter: [asciifolding, lowercase, trim]
