# Security checks on every pull request, every push to main and every Monday, when new advisories may have come out:
# bin/leaks for secrets in the files and the history, Brakeman for vulnerabilities in the code, and bundler-audit for
# gems with known ones. The ruleset on main requires the Secrets check before a pull request merges.
name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: Secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check Out Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # bin/leaks scans every commit reachable from HEAD.
          fetch-depth: 0

      - name: Scan for Secrets
        run: bin/leaks

  brakeman:
    name: Brakeman
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check Out Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set Up Ruby
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          bundler-cache: true

      - name: Scan Code for Vulnerabilities
        run: bin/brakeman --no-pager

  bundler-audit:
    name: Bundler Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check Out Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set Up Ruby
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          bundler-cache: true

      - name: Check Gems for Known Vulnerabilities
        run: bin/bundler-audit check --update
