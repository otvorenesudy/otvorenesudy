# Security checks on every pull request, every push to main and every Monday, when new advisories may have come out:
# bin/leaks for secrets in the files and the history, Brakeman for vulnerabilities in the code, and bundler-audit for
# gems with known ones. The ruleset on main requires the Secrets check before a pull request merges.
name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: Secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # bin/leaks scans every commit reachable from HEAD.
          fetch-depth: 0

      - name: Scan for Secrets
        run: bin/leaks

  brakeman:
    name: Brakeman
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set Up Ruby
        uses: ruby/setup-ruby@e1bd6146574da5e0795075b5319b300edb30c5b0 # v1.333.0
        with:
          bundler-cache: true

      - name: Scan Code for Vulnerabilities
        run: bin/brakeman --no-pager

  bundler-audit:
    name: Bundler Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set Up Ruby
        uses: ruby/setup-ruby@e1bd6146574da5e0795075b5319b300edb30c5b0 # v1.333.0
        with:
          bundler-cache: true

      - name: Check Gems for Known Vulnerabilities
        run: bin/bundler-audit check --update
